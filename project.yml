name: SatTracker

options:
  bundleIdPrefix: com.lucatufariello
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  SatelliteKit:
    url: https://github.com/gavineadie/SatelliteKit.git
    exactVersion: 2.1.2

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  SatTracker:
    type: application
    platform: macOS
    sources:
      - path: SatTracker
    dependencies:
      - package: SatelliteKit
        product: SatelliteKit
    settings:
      base:
        PRODUCT_NAME: SatTracker
        PRODUCT_BUNDLE_IDENTIFIER: com.lucatufariello.SatTracker
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SatTracker
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSLocationUsageDescription: "SatTracker uses your location to predict when satellites pass over you."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "SatTracker uses your location to predict when satellites pass over you."
        INFOPLIST_KEY_NSHumanReadableCopyright: "Personal use."
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: SatTracker/Resources/SatTracker.entitlements
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  SatTrackerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SatTrackerTests
    dependencies:
      - target: SatTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucatufariello.SatTrackerTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SatTracker.app/Contents/MacOS/SatTracker"

schemes:
  SatTracker:
    build:
      targets:
        SatTracker: all
        SatTrackerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SatTrackerTests
    archive:
      config: Release

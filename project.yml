name: Caelus

options:
  bundleIdPrefix: com.lucatufariello
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  SatelliteKit:
    url: https://github.com/gavineadie/SatelliteKit.git
    exactVersion: 2.1.2

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  Caelus:
    type: application
    platform: macOS
    sources:
      - path: Caelus
    dependencies:
      - package: SatelliteKit
        product: SatelliteKit
    settings:
      base:
        PRODUCT_NAME: Caelus
        PRODUCT_BUNDLE_IDENTIFIER: com.lucatufariello.Caelus
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Caelus
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSLocationUsageDescription: "Caelus uses your location to predict when satellites pass over you."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Caelus uses your location to predict when satellites pass over you."
        INFOPLIST_KEY_NSHumanReadableCopyright: "Personal use."
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Caelus/Resources/Caelus.entitlements
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  CaelusTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CaelusTests
    dependencies:
      - target: Caelus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucatufariello.CaelusTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Caelus.app/Contents/MacOS/Caelus"

schemes:
  Caelus:
    build:
      targets:
        Caelus: all
        CaelusTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - CaelusTests
    archive:
      config: Release
